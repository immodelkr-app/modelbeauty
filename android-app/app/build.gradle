plugins {
    id 'com.android.application'
}

// google-services.json이 아직 없으면(Firebase 프로젝트 연동 전) 빌드가 깨지지 않도록 조건부 적용.
// 파일을 추가하고 나면 다음 Gradle Sync부터 자동으로 활성화된다.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

// 앱 서명 키 비밀번호는 저장소에 커밋하지 않는다(공개 저장소이므로 유출 위험).
// android-app/keystore.properties 파일에서 읽어오며, 파일이 없으면 null로 두어
// 서명 없는 로컬 빌드는 계속 가능하도록 한다.
def keystoreProps = null
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystoreProps = new Properties()
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'kr.modelbeauty'
    compileSdk 36

    defaultConfig {
        applicationId "kr.modelbeauty"
        minSdk 24
        targetSdk 36
        versionCode 18
        versionName "1.0.18"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {
            // 서명 정보는 저장소에 커밋하지 않는 android-app/keystore.properties에서 읽는다.
            // (파일 양식은 keystore.properties.example 참고)
            if (keystoreProps != null) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // keystore.properties가 없으면 서명 없이 빌드된다(로컬 확인용).
            // 출시용 AAB를 만들 때는 반드시 해당 파일이 있어야 한다.
            if (keystoreProps != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.biometric:biometric:1.1.0'

    // 앱 푸시(FCM)
    implementation platform('com.google.firebase:firebase-bom:34.5.0')
    implementation 'com.google.firebase:firebase-messaging'
}
